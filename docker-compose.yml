services:
  prelegal:
    build:
      context: .
      dockerfile: Dockerfile
    image: prelegal:latest
    container_name: prelegal
    ports:
      - "8000:8000"
    # Read from the repo-root .env at `up` time, never baked into the image.
    # Left unset the container still starts and serves — the chat is the only
    # thing that needs it, and it says so itself when it is missing.
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    # Deliberately no volumes. The SQLite database lives inside the container's
    # writable layer, so `down` discards it and the next `up` builds a new one
    # from schema.sql — see backend/app/db.py.
    healthcheck:
      # The image has no curl; Python is the thing it definitely has.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health').read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
