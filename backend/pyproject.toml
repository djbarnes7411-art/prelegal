[project]
name = "prelegal-backend"
version = "0.1.0"
description = "FastAPI backend for Prelegal: serves the API and the built frontend."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.2",
    "litellm>=1.93.0",
    "pydantic[email]>=2.12.4",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    # Starlette's TestClient transport. httpx2, not httpx — Starlette 1.3
    # deprecates the latter.
    "httpx2>=2.0.1",
    "pytest>=9.0.1",
]

# Nothing imports this project as a library — uvicorn and pytest both load `app`
# from the source tree — so there is no wheel to build.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
